<!-- Optional Filter Input -->
<mat-form-field appearance="outline" class="w-100 mb-3">
  <mat-label>Filter Categories</mat-label>
  <input matInput (keyup)="applyFilter($event)" placeholder="Ex. Animation" #input>
</mat-form-field>

<div class="mat-elevation-z8">
  <table mat-table [dataSource]="dataSource" matSort class="w-100">

    <!-- Category ID Column -->
    <ng-container matColumnDef="categoryId">
      <th mat-header-cell *matHeaderCellDef mat-sort-header> Category ID </th>
      <td mat-cell *matCellDef="let element"> {{element.categoryId}} </td>
    </ng-container>

    <!-- Category Name Column -->
    <ng-container matColumnDef="name">
      <th mat-header-cell *matHeaderCellDef mat-sort-header> Category Name </th>
      <td mat-cell *matCellDef="let element"> {{element.name}} </td>
    </ng-container>

    <!-- Last Update Column -->
    <ng-container matColumnDef="lastUpdate">
      <th mat-header-cell *matHeaderCellDef mat-sort-header> Last Upate </th>
      <td mat-cell *matCellDef="let element"> {{element.lastUpdate}} </td>
    </ng-container>

    <!-- Action Column -->
    <ng-container matColumnDef="action">
      <th mat-header-cell *matHeaderCellDef> Action </th>
      <td mat-cell *matCellDef="let element">
        <button class="btn btn-primary btn-sm" (click)="editCategory(element.categoryId)"> Edit </button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

    <!-- Row shown when there is no matching data. -->
    <tr class="mat-row" *matNoDataRow>
      @if (input.value) {
      <td class="mat-cell" colspan="4">No data matching the filter "{{input.value}}"</td>
      } @else {
      <td class="mat-cell" colspan="4">Loading categories or no data available...</td>
      }
    </tr>
  </table>

  <mat-paginator [pageSizeOptions]="[5, 10, 20]" showFirstLastButtons></mat-paginator>
</div>
