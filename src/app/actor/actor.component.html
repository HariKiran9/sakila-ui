<!-- Optional Filter Input -->
<mat-form-field appearance="outline" class="w-100 mb-3">
  <mat-label>Filter Actors</mat-label>
  <input matInput (keyup)="applyFilter($event)" placeholder="Ex. John Doe" #input>
</mat-form-field>

<div class="mat-elevation-z8">
  <table mat-table [dataSource]="dataSource" matSort class="w-100">

    <!-- Actor ID Column -->
    <ng-container matColumnDef="actorId">
      <th mat-header-cell *matHeaderCellDef mat-sort-header> Actor ID </th>
      <td mat-cell *matCellDef="let element"> {{element.actorId}} </td>
    </ng-container>

    <!-- First Name Column -->
    <ng-container matColumnDef="firstName">
      <th mat-header-cell *matHeaderCellDef mat-sort-header> First Name </th>
      <td mat-cell *matCellDef="let element"> {{element.firstName}} </td>
    </ng-container>

    <!-- Last Name Column -->
    <ng-container matColumnDef="lastName">
      <th mat-header-cell *matHeaderCellDef mat-sort-header> Last Name </th>
      <td mat-cell *matCellDef="let element"> {{element.lastName}} </td>
    </ng-container>

    <!-- Last Update Column -->
    <ng-container matColumnDef="lastUpdate">
      <th mat-header-cell *matHeaderCellDef mat-sort-header> Last Update </th>
      <td mat-cell *matCellDef="let element"> {{element.lastUpdate}} </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

    <!-- Row shown when there is no matching data. -->
    <tr class="mat-row" *matNoDataRow>
      @if (input.value) {
      <td class="mat-cell" colspan="4">No data matching the filter "{{input.value}}"</td>
      } @else {
      <td class="mat-cell" colspan="4">Loading actors or no data available...</td>
      }
    </tr>
  </table>

  <mat-paginator [pageSizeOptions]="[5, 10, 20]" showFirstLastButtons></mat-paginator>
</div>
